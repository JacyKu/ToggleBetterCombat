plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    modApi "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    modImplementation "maven.modrinth:better-combat:${rootProject.bettercombat_version}-fabric"
    modImplementation "dev.kosmx.player-anim:player-animation-lib-fabric:$rootProject.player_anim_version"
    // Required by Better Combat at runtime; not used by this mod.
    modLocalRuntime("me.shedaniel.cloth:cloth-config-fabric:$rootProject.cloth_config_version") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    modLocalRuntime "io.github.llamalad7:mixinextras-fabric:$rootProject.mixin_extras_version"
    implementation "io.github.llamalad7:mixinextras-common:$rootProject.mixin_extras_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier.set('dev-shadow')
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
}
