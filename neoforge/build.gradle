plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    modApi "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    // Compile + runtime dependencies.
    modImplementation "maven.modrinth:better-combat:${rootProject.bettercombat_version}-neoforge"
    modImplementation "dev.kosmx.player-anim:player-animation-lib-forge:$rootProject.player_anim_version"
    // Required by Better Combat at runtime; not used by this mod.
    modLocalRuntime "me.shedaniel.cloth:cloth-config-neoforge:$rootProject.cloth_config_version"
    // Better Combat ships Tiny Config as a nested jar for production, but
    // Architectury Loom does not put nested jars on the dev runtime classpath.
    modImplementation "maven.modrinth:tiny-config:${rootProject.tiny_config_version}-neoforge"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}
