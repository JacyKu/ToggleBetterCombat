name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Collect jars
        run: |
          mkdir -p dist
          cp fabric/build/libs/togglebettercombat-fabric-*.jar dist/
          cp forge/build/libs/togglebettercombat-forge-*.jar dist/
          rm -f dist/*-sources.jar dist/*-dev-shadow.jar
          ls -l dist

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: togglebettercombat-jars
          path: dist/*.jar
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
