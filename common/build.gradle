architectury {
    common rootProject.enabled_platforms.split(',')
}

dependencies {
    // Fabric Loader is used only for the common @Environment annotations.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Architectury API.
    modCompileOnly "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    // Better Combat. The Fabric artifact is mapped to the common project's Yarn mappings by Loom.
    modCompileOnly "maven.modrinth:better-combat:${rootProject.bettercombat_version}-fabric"
}
